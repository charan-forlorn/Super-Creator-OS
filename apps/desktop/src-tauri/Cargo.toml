[package]
name = "haios-video-studio"
version = "1.0.0"
description = "HAIOS AI Video Studio desktop backend (Tauri 2 bridge over ffmpeg/ffprobe HVS core)"
authors = ["HAIOS"]
edition = "2021"

[lib]
name = "haios_video_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
